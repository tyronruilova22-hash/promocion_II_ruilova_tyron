<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <style>
        body { font-family: sans-serif; margin: 40px; color: #333; }
        h1 { font-size: 2.5em; margin-bottom: 5px; }
        h2 { margin-top: 30px; }
        table { border-collapse: collapse; width: 100%; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f9f9f9; font-weight: bold; }
        .footer { background-color: #3b5998; color: white; padding: 8px 15px; display: inline-block; margin-top: 30px; border-radius: 3px; font-size: 0.9em; }
    </style>
</head>
<body>
    {% block content %}
    {% endblock %}

    <!-- Pie de página azul -->
    <div class="footer">2026 TaskFlow</div>
</body>
</html>
